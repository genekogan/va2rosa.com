# Deploy settings for Netlify.
#
# vanessarosa.art is the canonical address. Any other domain pointed at this
# site — va2rosa.com, or the *.netlify.app address — is redirected to it, so
# search engines and readers only ever settle on one.

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

[[redirects]]
  from = "https://va2rosa.com/*"
  to = "https://vanessarosa.art/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://www.va2rosa.com/*"
  to = "https://vanessarosa.art/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://www.vanessarosa.art/*"
  to = "https://vanessarosa.art/:splat"
  status = 301
  force = true

# Pictures and video are content-hashed by name and never edited in place.
[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000"

[[headers]]
  for = "/video/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
